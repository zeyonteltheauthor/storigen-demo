<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STORIGEN OS™ — Watch your thinking become visible</title>
<meta name="description" content="STORIGEN OS clickable demo: the Seven Lenses turn a half-formed idea into a visible thinking map. Human first. AI assists. The learner decides.">
<meta name="theme-color" content="#0A1020">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230A1020'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23D1A954' opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23F2DDA4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="twinkles" id="twinkles" aria-hidden="true"></div>

<!-- Sound: off by default, remembered on this device -->
<button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Sound effects" title="Sound is off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="w" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<!-- SCREEN 1: almost nothing -->
<section id="intro" class="intro" aria-labelledby="introQ">
  <form id="introForm" class="intro-inner" autocomplete="off">
    <div class="lantern" aria-hidden="true"></div>
    <h1 id="introQ" class="intro-q">What are you thinking about?</h1>
    <label for="ideaInput" class="sr">Type an idea, a topic, a question, or a problem. Even half an idea is fine.</label>
    <div class="intro-box">
      <input id="ideaInput" name="idea" type="text" maxlength="160" placeholder="A girl finds a locked door in her school." aria-describedby="introHint">
      <button id="ideaGo" type="submit" class="go" aria-label="Start thinking">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p id="introHint" class="intro-hint">Even half an idea. Press Enter to try the example.</p>
    <p id="introMsg" class="intro-msg" role="alert" hidden></p>
  </form>
</section>

<!-- SCREEN 2: the map -->
<main id="main" class="app" hidden>
  <header class="topbar">
    <span class="mark" aria-label="STORIGEN OS">STORIGEN <span class="os">OS</span><span class="tm">™</span></span>
    <span id="modeTag" class="mode-tag" hidden></span>
    <span id="viewTag" class="view-tag" aria-live="polite" hidden></span>
    <button id="restart" class="link-btn" type="button">New idea</button>
  </header>

  <div class="workspace">
    <div class="stage-wrap">
      <div id="stage" class="stage" role="img" aria-label="Your thinking map">
        <div id="halo" class="halo" aria-hidden="true"></div>
        <svg id="links" class="links" aria-hidden="true"></svg>
        <div id="nodes"></div>
        <div id="knowBanner" class="know-banner" aria-hidden="true"><span>Look what you already know.</span></div>
      </div>
    </div>

    <aside id="panel" class="panel" aria-labelledby="qText">
      <div id="panelInner"></div>
    </aside>
  </div>

  <ul id="srMap" class="sr" aria-label="Your thinking map, as text"></ul>
</main>

<!-- SCREEN 3: the payoff. The learner's own words, assembled. -->
<section id="reveal" class="reveal" role="dialog" aria-modal="true" aria-labelledby="rvTitle" hidden>
  <div id="rvInner"></div>
  <p id="rvLive" class="sr" aria-live="polite"></p>
</section>
<div id="ghosts" class="ghosts" aria-hidden="true"></div>

<footer class="principle">Human first. AI assists. The learner decides.</footer>

<div id="planModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="planTitle" hidden>
  <div class="modal-card" id="planCard"></div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
